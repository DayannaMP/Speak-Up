function confetti(){if(reduced)return;const c=document.getElementById('fx');c.hidden=false;const ctx=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;const cs=getComputedStyle(document.documentElement);const cols=['--pop','--sky','--mint','--sun','--lime'].map(v=>cs.getPropertyValue(v).trim());const P=Array.from({length:110},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6}));let f=0;(function loop(){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.a+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore()});if(++f<90)requestAnimationFrame(loop);else{ctx.clearRect(0,0,W,H);c.hidden=true}})()}

function distract(it,pool,f){const seen=new Set([it[f]]);const out=[];for(const p of shuffle(pool)){if(!seen.has(p[f])){seen.add(p[f]);out.push(p[f]);if(out.length===3)break}}return out}
function makeQ(it,pool,only){
  let types=only?[only]:['listen','listen','en2es','es2en','en2es'];
  const ws=it[2].split(' ');
  if(!only){if(ws.length>=3&&ws.length<=8)types.push('build','build');if(/^[a-z' ]+$/i.test(it[0])&&it[0].length<=14)types.push('type')}
  const t=pick(types),q={t,it};
  if(t==='listen'||t==='en2es')q.opts=shuffle([it[1],...distract(it,pool,1)]);
  if(t==='es2en')q.opts=shuffle([it[0],...distract(it,pool,0)]);
  if(t==='build'){q.words=ws;let b=shuffle(ws.map((w,i)=>i));if(b.every((v,i)=>v===i))b=b.reverse();q.bank=b;q.pick=[]}
  return q;
}
function startQuiz(k,mode,u,only){
  let items,pool;
  if(mode==='unit'){items=shuffle(UNITS[u].items).slice(0,10);pool=UNITS[u].items.concat(u>0?UNITS[u-1].items:UNITS[1].items)}
  else{
    pool=[];UNITS.forEach((un,i)=>{if(unitDone(k,i)||k.units[i])pool.push(...un.items)});
    if(pool.length<8)pool=UNITS[0].items.slice();
    const w=it=>{const s=k.words[it[0]];return s?1+s.w*3-Math.min(s.r,4)*.2:1.5};
    const bag=[];pool.forEach(it=>{const n=Math.max(1,Math.round(w(it)*2));for(let j=0;j<n;j++)bag.push(it)});
    const chosen=new Map();let guard=0;while(chosen.size<Math.min(10,pool.length)&&guard++<500){const it=pick(bag);chosen.set(it[0],it)}
    items=[...chosen.values()];
  }
  go({s:'quiz',kid:k.id,mode,u,qs:items.map(it=>makeQ(it,pool,only)),i:0,right:0,ans:null,only});
}

  if(/s$/.test(plain)&&D[plain.slice(0,-1)])return{es:D[plain.slice(0,-1)]};
  if(/ed$/.test(plain)){for(const c of [plain.slice(0,-2),plain.slice(0,-1)])if(D[c])return{es:D[c]+' (pasado)'}}
  if(/'s$/.test(plain)&&D[plain.slice(0,-2)])return{es:D[plain.slice(0,-2)]+' + es/está'};
  if(/'ll$/.test(plain)&&D[plain.slice(0,-3)])return{es:D[plain.slice(0,-3)]+' + (futuro)',note:"'ll = will (futuro)"};
  return{es:'?'};
}
let DICT={};(function(){Object.entries(EXTRA).forEach(([k,v])=>{DICT[k.replace(/_$/,'').replace('_',"'")]=v});UNITS.forEach(u=>u.items.forEach(it=>{it[0].split(' / ').forEach(a=>{DICT[norm(a)]=it[1]})}))})();
function localBreak(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean).slice(0,4);
  return{local:true,lines:lines.map(l=>{const toks=l.split(/\s+/);const words=[];
    for(let i=0;i<toks.length;i++){let done=false;for(const n of [3,2]){if(i+n<=toks.length){const ph=norm(toks.slice(i,i+n).join(' '));if(DICT[ph]){words.push({w:toks.slice(i,i+n).join(' '),es:DICT[ph]});i+=n-1;done=true;break}}}
      if(!done){const r=lookup(toks[i]);words.push({w:toks[i],es:r.es,note:r.note||''})}}
    return{en:l,words,natural:''}})};
}
async function translateSong(k){
  const s=songs[k.id];const text=s.text.split('\n').map(l=>l.trim()).filter(Boolean).slice(0,4).join('\n').slice(0,400);
  if(!text){s.err='Escribe al menos una línea.';render();return}
  s.err='';s.shown={};s.nat={};
  if(!sample||sampleState!=='ok'){s.res=localBreak(text);k.songLines+=s.res.lines.length;save();render();return}
  s.busy=true;render();
  try{const r=await sample.json(songPrompt(k,text),{modelTier:'quick'});
    if(!r||!Array.isArray(r.lines))throw{code:'invalid_json'};
    r.lines=r.lines.filter(l=>l&&Array.isArray(l.words)).map(l=>({en:String(l.en||''),natural:String(l.natural||''),words:l.words.map(w=>({w:String(w.w||''),es:String(w.es||''),note:String(w.note||'')}))}));
    r.tip=String(r.tip||'');s.res=r;k.songLines+=r.lines.length;k.xp+=5*r.lines.length;save();
  }catch(e){if(HIDE_CODES.includes(e?.code)){sampleState='off';s.res=localBreak(text)}else s.err=errCopy(e?.code)}
  s.busy=false;if(V.s==='pro'&&V.tab==='song')render();
}

  quiz:d=>startQuiz(kid(),'unit',+d.u),
  review:d=>startQuiz(kid(),'review',null,d.only||undefined),
  choose:d=>{if(V.ans)return;const q=V.qs[V.i];const f=q.t==='es2en'?0:1;markAnswer(d.v===q.it[f],d.v)},
  pickw:d=>{const q=V.qs[V.i];const b=+d.b;if(!q.pick.includes(b)){q.pick.push(b);render()}},
  unpick:d=>{const q=V.qs[V.i];q.pick.splice(+d.p,1);render()},
  checkBuild:()=>{const q=V.qs[V.i];const got=q.pick.map(i=>q.words[i]).join(' ');markAnswer(got===q.words.join(' '),got)},
  checkType:()=>{const q=V.qs[V.i];const v=document.getElementById('ansIn').value;if(!v.trim())return;const alts=q.it[0].split(' / ').map(norm);const n=norm(v);markAnswer(alts.includes(n)||alts.map(x=>x.replace(/'/g,'')).includes(n.replace(/'/g,'')),v)},
  next:()=>{if(V.i<V.qs.length-1){V.i++;V.ans=null;render()}else finishQuiz()},
  scn:d=>{const k=kid();chats[k.id]={scn:d.id,turns:[],busy:false,err:'',draft:''};coachSend(k,'',true)},
  sendCoach:()=>{const k=kid(),el=document.getElementById('coachIn'),t=el.value.trim();if(t)coachSend(k,t,false)},
  stopCoach:()=>chats[V.kid]?.ctl?.abort(),
  translate:()=>{const k=kid();songs[k.id].text=document.getElementById('songIn').value;translateSong(k)},
  songEx:()=>{const s=songs[V.kid];s.text="I'm gonna shine tonight\nYou know we ain't gonna stop\nC'mon, let's get it";s.res=null;render()},
  reveal:d=>{const s=songs[V.kid];s.shown[d.k]=true;if(d.t)say(d.t);render()},
  showNat:d=>{songs[V.kid].nat[d.l]=true;render()},
  miniHome:()=>go({s:'mini',kid:V.kid}),
  miniCat:d=>{go({s:'miniCat',kid:V.kid,cat:d.c});say(MINI[d.c].t+'!')},
  miniCatBack:()=>go({s:'miniCat',kid:V.kid,cat:V.cat}),
  miniSay:d=>{const it=MINI[V.cat].items[+d.i];speakSeq(VO.esMeaning?[[it[0],'en'],[1400,'pause'],[it[2],'es']]:[[it[0],'en']]);const el=document.getElementById('mi'+d.i);if(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}},
  miniPlay:()=>{const k=kid();k.miniPlays[V.cat]=(k.miniPlays[V.cat]||0)+1;save();V={s:'miniGame',kid:k.id,cat:V.cat,round:0,last:-1};miniRound();render()},
  miniRepeat:()=>{const c=MINI[V.cat];say(c.q(c.items[V.target][0]))},
  miniPick:d=>{if(V.won)return;const i=+d.i,c=MINI[V.cat],k=kid();
    if(i===V.target){V.won=true;k.stars++;save();tone(true);speakSeq([[pick(PRAISE),'en'],[350,'pause'],[c.items[i][0]+'!','en']]);render();setTimeout(()=>{if(V.s!=='miniGame')return;V.round++;if(V.round>=6){render();confetti();say('Great job! You are a star!')}else{miniRound();render()}},1600)}
    else{tone(false);const el=document.getElementById('g'+i);if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}speakSeq([['This is '+c.items[i][0]+'.','en'],[700,'pause'],[c.q(c.items[V.target][0]),'en']])}},
  resetAsk:d=>{V.confirm=d.id;render()},
  resetNo:()=>{V.confirm=null;render()},
  resetYes:d=>{const i=state.kids.findIndex(k=>k.id===d.id);const o=state.kids[i];state.kids[i]=newKid(o.id,o.name,o.age,o.track,o.color);V.confirm=null;save();render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b.dataset,b)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='chal'){songs[V.kid].challenge=t.checked;render();return}
  if(t.classList&&t.classList.contains('tabOwn')){TAB.owners=[...document.querySelectorAll('.tabOwn:checked')].map(x=>x.value);saveTab();return}
  if(t.id==='gkey'){TAB.gkey=t.value.trim();saveTab();setupGemini();render();return}
  if(t.id==='vEn'){VO.en=t.value;saveVO();pickVoice();say('Hi! This is my new voice.');return}
  if(t.id==='vEs'){VO.es=t.value;saveVO();pickVoice();sayEs('Hola, esta es mi nueva voz.');return}
  if(t.id==='esMean'){VO.esMeaning=t.checked;saveVO();return}
  if(t.dataset.f){const k=state.kids.find(x=>x.id===t.dataset.id);if(!k)return;const f=t.dataset.f;let v=t.value;if(f==='age'){v=Math.max(2,Math.min(99,parseInt(v,10)||k.age))}if(f==='name'){v=v.trim().slice(0,18)||k.name}k[f]=v;save();render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='coachIn'&&chats[V.kid])chats[V.kid].draft=t.value;
  if(t.id==='songIn'&&songs[V.kid])songs[V.kid].text=t.value;
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey)return;
  if(e.target.id==='ansIn'){e.preventDefault();A.checkType()}
  if(e.target.id==='coachIn'){e.preventDefault();A.sendCoach()}
});
if(STANDALONE&&tabletKids().length===1){const k=tabletKids()[0];V=k.track==='pro'?{s:'pro',kid:k.id,tab:'mission'}:{s:'mini',kid:k.id}}
render();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body></html>
